name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.enableR8.fullMode=false
          PROPS

      - name: Build release APK (arm64-v8a)
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          echo "=== All build outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "outputs dir not found"
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Sign APK
        run: |
          jarsigner \
            -keystore keystore.jks \
            -storepass "${{ secrets.KEY_STORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -signedjar app-release-signed.apk \
            "${{ steps.find_apk.outputs.apk_path }}" \
            "${{ secrets.KEY_ALIAS }}"

      - name: Verify signature
        run: jarsigner -verify app-release-signed.apk && echo "Signature OK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SSUCheck-arm64-signed
          path: app-release-signed.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks
