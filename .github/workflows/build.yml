name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'PROPS'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.enableR8.fullMode=false
          PROPS

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Decode keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > keystore.jks

      - name: Sign and align APK with apksigner
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner
          ZIPALIGN=$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign
          echo "Using build-tools: $BUILD_TOOLS"

          # Zipalign first (required before apksigner)
          $ZIPALIGN -v -p 4 \
            "${{ steps.find_apk.outputs.apk_path }}" \
            app-release-aligned.apk

          # Sign with v1+v2+v3
          $APKSIGNER sign \
            --ks keystore.jks \
            --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app-release-signed.apk \
            app-release-aligned.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner verify \
            --verbose app-release-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: SSUCheck-arm64-signed
          path: app-release-signed.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app-release-signed.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: rm -f keystore.jks app-release-aligned.apk
